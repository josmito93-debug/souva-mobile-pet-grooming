            "@type": "Question",
            "name": "How does solar-powered mobile dog grooming benefit my pet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our custom mobile salons operate on an autonomous 100% solar lithium battery bank. Unlike loud generator-powered vans, our solar van is whisper-quiet, producing zero toxic exhaust fumes outside your home and zero generator vibrations, keeping your dog calm and comfortable throughout the session."
            }
          },
          {
            "@type": "Question",
            "name": "Are dogs caged or crated during grooming?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Never. SOUVA is 100% cage-free. We only groom one pet at a time, providing undivided 1-on-1 attention with gentle warm hand blow-drying and ergonomic hydraulic lifting tables."
            }
          },
          {
            "@type": "Question",
            "name": "How does the 20% discount on the second dog work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When you schedule two dogs for the same visit of our solar mobile van, an automatic 20% discount is applied to the second dog's base grooming package during booking."
            }
          },
          {
            "@type": "Question",
            "name": "What pet shampoos and spa products do you use?",
            "acceptedAnswer": {
              "@type": "Answer",
